name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      TYPE_DB: mongo
      DATABASE_URL: mongodb://localhost:27017/qolqa_test
      SECRET_KEY: test-secret-key-with-at-least-32-characters-long
      GOOGLE_CLIENT_ID: dummy-client-id.apps.googleusercontent.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Pytest suite
        run: |
          pytest --cov=. --cov-report=term-missing -v

  docker-build-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image (Production target)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-dokploy-webhook:
    name: Trigger Dokploy webhook
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [test-and-lint, docker-build-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Dokploy deploy webhook
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          http_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 -X POST "$DOKPLOY_WEBHOOK_URL")
          echo "Dokploy webhook responded with HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Dokploy webhook failed (HTTP $http_code)"
            exit 1
          fi
